// The validator's copy of the agreed contract.
syntax = "proto3";

package library.v1;

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  int32 year = 4;
}

message GetBookRequest {
  string id = 1;
}

message ListBooksRequest {
  string author = 1;
}

message AddBooksSummary {
  int32 added = 1;
  repeated string ids = 2;
}

service Library {
  rpc GetBook (GetBookRequest) returns (Book);
  rpc ListBooks (ListBooksRequest) returns (stream Book);
  rpc AddBooks (stream Book) returns (AddBooksSummary);
}
