syntax = "proto3";

package library.v1;

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  int32 year = 4;
}

message GetBookRequest {
  string id = 1;
}

// TODO 1: ListBooksRequest { string author = 1; }   ('' means every author)
// TODO 2: AddBooksSummary  { int32 added = 1;  repeated string ids = 2; }

service Library {
  rpc GetBook (GetBookRequest) returns (Book);

  // TODO 3: ListBooks: server streaming. Takes a ListBooksRequest, streams back Books.
  // TODO 4: AddBooks: client streaming. Takes a stream of Books, returns one AddBooksSummary.
}
