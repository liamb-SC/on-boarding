// The validator's copy of the agreed contract: what existing clients were
// built against. Your proto must be wire-compatible with it.
syntax = "proto3";

package library.v1;

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  int32 year = 4;
}

message GetBookRequest {
  string id = 1;
}

service Library {
  rpc GetBook (GetBookRequest) returns (Book);
}
