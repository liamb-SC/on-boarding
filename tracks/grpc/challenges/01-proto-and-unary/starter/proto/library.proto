syntax = "proto3";

package library.v1;

// A message is a typed record. Each field has a NUMBER, and that number (not
// the name) is what goes over the wire. Never change or reuse a field number
// once clients depend on it.
message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  int32 year = 4;
}

