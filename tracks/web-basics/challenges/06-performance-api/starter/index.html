<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sales report</title>
  <style>body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; }</style>
</head>
<body>
  <h1>Monthly sales</h1>
  <button id="build" type="button">Build report</button>
  <pre id="out"></pre>
  <h2>Measures</h2>
  <ul id="measures"></ul>
  <script type="module">
    import { watchMeasures } from './src/observe.js';
    import { buildReport } from './src/report.js';

    watchMeasures(({ name, duration }) => {
      const li = document.createElement('li');
      li.textContent = `${name}: ${duration.toFixed(1)} ms`;
      document.getElementById('measures').append(li);
    });
    document.getElementById('build').addEventListener('click', () => {
      document.getElementById('out').textContent = JSON.stringify(buildReport(), null, 2);
    });
  </script>
</body>
</html>
