<!doctype html>
<meta charset="utf-8">
<title>Live chat</title>
<style>body { font: 16px system-ui; max-width: 40rem; margin: 2rem auto; } li small { color: #888; }</style>
<h1>Live chat</h1>
<form id="f"><input id="t" autocomplete="off" placeholder="Say something"> <button>Send over WebSocket</button></form>
<h2>Over WebSocket</h2><ul id="ws"></ul>
<h2>Over SSE (EventSource)</h2><ul id="sse"></ul>
<script>
  const add = (id, text) => { const li = document.createElement('li'); li.textContent = text; document.getElementById(id).append(li); };

  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (e) => add('ws', e.data);
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    ws.send(JSON.stringify({ text: document.getElementById('t').value }));
    document.getElementById('t').value = '';
  };

  const es = new EventSource('/events');
  es.addEventListener('message', (e) => add('sse', `#${e.lastEventId} ${e.data}`));
</script>
